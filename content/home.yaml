title: Digitale Assistenten in Overheidsdienstverlening
eyebrow: Raamwerk
lede:
  - >
    Dit raamwerk biedt publieke organisaties houvast om hun digitale assistenten aantoonbaar op een verantwoorde en toekomstbestendige manier te ontwikkelen en te beheren.
  - >
   Er komt veel kijken bij de inzet van een digitale (AI) assistent binnen de overheid. Op heel veel plaatsen wordt relevante informatie ontwikkeld die je wilt meenemen in een traject. Het overzicht houden is soms uitdagend. Bovendien ontwikkelt de materie zich razendsnel. Dit raamwerk biedt publieke organisaties houvast om hun digitale assistenten aantoonbaar op een verantwoorde en toekomstbestendige manier te ontwikkelen en te beheren, door al deze informatie samen te brengen op een plek.
   Het raamwerk omvat vier fundamenten en tien domeinen. Samen bieden zij een gecureerd overzicht van alle relevante thema’s, waarbij informatie uit bestaande, gezaghebbende bronnen is meegenomen, aangevuld met good practices. Hierdoor krijgen organisaties duidelijk inzicht in alle relevante aandachtspunten én in hoe zij deze in de praktijk op een verantwoorde en effectieve manier kunnen realiseren. Op deze manier helpt het raamwerk organisaties om digitale assistenten sneller, beter en consistenter te ontwikkelen en in te zetten, zonder het wiel opnieuw uit te hoeven vinden.


lede_sub: >
  Bedoeld voor beleidsmakers, projectleiders, IT-professionals en bestuurders die grip
  willen krijgen op AI in publieke dienstverlening.
diagram_hint: >
  Klik op een segment om de fundamentele domeinen te bekijken, of op het midden voor de domeinen die samen de digitale assistent vormen. 

fundamenten_section:
  label: Fundamenten
  description: >
    Zonder deze vier fundamenten is een verantwoorde digitale assistent niet mogelijk.
    Ze vormen de basis waarop alle andere domeinen rusten.

assistent_section:
  label: Digitale Assistent
  description: >
    De onderdelen die samen de digitale assistent vormen, van prompt en context tot
    kwaliteit, veiligheid en gebruikerservaring.


