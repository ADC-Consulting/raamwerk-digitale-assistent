  <!-- If a script fails to load or compile, React never mounts and the page
       stays blank. Say what to try instead of showing nothing. -->
  <script>
    setTimeout(function () {
      var root = document.getElementById('root');
      if (root && root.children.length === 0) {
        root.innerHTML =
          '<div style="font-family:sans-serif;max-width:640px;margin:15vh auto;padding:0 20px;color:#0b1d2e">' +
          '<h1 style="font-size:24px;color:#154273">De site kon niet geladen worden</h1>' +
          '<p>Dit komt meestal door een verouderde versie in de cache van je browser. ' +
          'Ververs de pagina met Cmd+Shift+R (Mac) of Ctrl+F5 (Windows).</p>' +
          '<p style="color:#4a5d72;font-size:14px">Blijft dit staan? Kijk in de console van de browser welke melding er verschijnt.</p>' +
          '</div>';
      }
    }, 8000);
  </script>
